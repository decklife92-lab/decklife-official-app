<script>
function copyAndOpen(text, link, msg){
  navigator.clipboard.writeText(text).then(()=>{
    showToast(msg);
    setTimeout(()=>{ window.open(link,'_blank'); }, 500);
  }).catch(()=>{
    showToast(msg);
    window.open(link,'_blank');
  });
}
function copyGmail(){

    setTimeout(()=>{
      window.open('https://mail.google.com/mail/?view=cm&fs=1&to='+email+'&su=Tanya%20Endorse%20Decklife','_blank');
    }, 400);
  });
}
function showToast(t){
  var el=document.getElementById('toast');
  el.innerText=t; el.style.display='block';
  setTimeout(()=>{el.style.display='none'},2500);
}
</script>
