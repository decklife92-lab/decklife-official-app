<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>@decklife - Endorse</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif}
body{min-height:100vh;background:url('bg.jpg') center/cover no-repeat fixed;display:flex;align-items:center;justify-content:center;padding:20px}
.card{background:#fff;width:100%;max-width:380px;border-radius:32px;padding:28px 20px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.4)}
.avatar{width:120px;height:120px;border-radius:50%;border:5px solid #fff;box-shadow:0 6px 20px rgba(0,0,0,.25);object-fit:cover;margin:0 auto 16px;display:block}
.username{font-size:36px;font-weight:800;color:#111;line-height:1}
.subtitle{font-size:14px;color:#666;margin:8px 0 20px}
.links{display:flex;flex-direction:column;gap:12px}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:16px;border-radius:14px;font-size:16px;font-weight:600;border:none;cursor:pointer;text-decoration:none;transition:.2s}
.btn-black{background:#111;color:#fff}
.btn-white{background:#fff;color:#111;border:1.5px solid #eee;box-shadow:0 2px 8px rgba(0,0,0,.05)}
.btn:active{transform:scale(.97)}
.icon{width:26px;height:26px}
.toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:#111;color:#fff;padding:12px 22px;border-radius:30px;font-size:13px;font-weight:600;display:none;z-index:99}
</style>
</head>
<body>
<div class="card">
<img class="avatar" src="bg.jpg" alt="@decklife">
<div class="username">@decklife</div>
<div class="subtitle">Kreator Visual Sunset & Sunrise</div>
<div class="links">
<button class="btn btn-black" onclick="window.open('kunci.html','_blank')">Whatsapp</button>

<button class="btn btn-white" onclick="copyGmail()">
<svg class="icon" viewBox="0 0 24 24" fill="#EA4335"><path d="M20 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4-8 5-8-5V6l8 5 8-5v2z"/></svg>
Gmail</button>

<button class="btn btn-white" onclick="copyAndOpen('@_decklife_','https://www.tiktok.com/@_decklife_','TikTok disalin!')">
<svg class="icon" viewBox="0 0 24 24" fill="#111"><path d="M19.59 6.69a4.83 4.83 0 0 1-3.77-1.77V16.5a4.5 4.5 0 1 1-4.5-4.5h.5V14a2.5 2.5 0 1 0 2.5 2.5V2h2a4.82 4.82 0 0 0 3.27 4.69z"/></svg>
Tik Tok</button>

<svg class="icon" viewBox="0 0 24 24"><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#feda75"/><stop offset="50%" stop-color="#d62976"/><stop offset="100%" stop-color="#4f5bd5"/></linearGradient><path fill="url(#g)" d="M7 2C4.2 2 2 4.2 2 7v10c0 2.8 2.2 5 5 5h10c2.8 0 5-2.2 5-5V7c0-2.8-2.2-5-5-5H7zm0 2h10c1.7 0 3 1.3 3 3v10c0 1.7-1.3 3-3 3H7c-1.7 0-3-1.3-3-3V7c0-1.7 1.3-3 3-3zm10 1a1 1 0 1 0 0 2 1 1 0 0 0 0-2zM12 7a5 5 0 1 0 0 10 5 5 0 0 0 0-10zm0 2a3 3 0 1 1 0 6 3 3 0 0 1 0-6z"/></svg>
Instagram</button>

<button class="btn btn-white" onclick="copyAndOpen('https://www.facebook.com/share/1cwja4Ee61/','https://www.facebook.com/share/1cwja4Ee61/','FB disalin!')">
<svg class="icon" viewBox="0 0 24 24" fill="#1877F2"><path d="M22 12c0-5.5-4.5-10-10-10S2 6.5 2 12c0 4.99 3.66 9.13 8.44 9.88v-6.99H7.9v-2.89h2.54V9.85c0-2.51 1.49-3.89 3.77-3.89 1.09 0 2.23.2 2.23.2v2.45h-1.26c-1.24 0-1.63.77-1.63 1.56v1.88h2.78l-.45 2.89h-2.33V21.88C18.34 21.13 22 16.99 22 12z"/></svg>
Facebook</button>
</div>
</div>
<div class="toast" id="toast"></div>
<script>
function copyAndOpen(t,l,m){navigator.clipboard.writeText(t).then(()=>{showToast(m);setTimeout(()=>{window.open(l,'_blank');},400);});}
function copyGmail(){var e='decklife92@gmail.com';navigator.clipboard.writeText(e).then(()=>{showToast('Gmail disalin!');setTimeout(()=>{window.open('https://mail.google.com/mail/?view=cm&fs=1&to='+e+'&su=Tanya%20Endorse%20Decklife','_blank');},400);});}
function showToast(t){var el=document.getElementById('toast');el.innerText=t;el.style.display='block';setTimeout(()=>{el.style.display='none'},2500);}
</script>
</body>
</html>
