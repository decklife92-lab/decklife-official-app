<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>@decklife - Endorse</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family: 'Segoe UI', sans-serif;}
body{
  min-height:100vh;
  background: url('bg.jpg') no-repeat center center fixed;
  background-size: cover;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:20px;
}
.card{
  width:100%; max-width:380px;
  background: rgba(30,20,10,0.55);
  backdrop-filter: blur(18px);
  border-radius:28px;
  padding:28px 22px 30px;
  border:1px solid rgba(255,255,255,0.15);
  text-align:center;
}
.avatar-wrap{width:110px;height:110px;margin:0 auto 14px;background:#fff;border-radius:50%;padding:5px;}
.avatar-wrap img{width:100%;height:100%;border-radius:50%;object-fit:cover;}
h1{color:#fff;font-size:38px;font-weight:800;margin-bottom:2px;}
p.sub{color:rgba(255,255,255,0.75);font-size:14px;margin-bottom:22px;}
.btn{width:100%;padding:16px;border:none;border-radius:14px;font-size:16px;font-weight:600;color:#fff;cursor:pointer;margin-bottom:12px;display:flex;justify-content:center;align-items:center;gap:8px;}
.btn-whatsapp{background:#1a1a1a;}
.btn-gmail{background:#ff3b30;}
.btn-tiktok{background:#000000; border:1px solid #333;}
.btn-instagram{background: linear-gradient(90deg,#f99d2e,#e94057,#c13584);}
.btn-facebook{background:#1877f2;}
.dot{width:18px;height:18px;background:#2ecc71;border-radius:50%;display:inline-block;}
.toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:#000;color:#fff;padding:12px 20px;border-radius:30px;font-size:14px;display:none;z-index:99;}
</style>
</head>
<body>
<div class="card">
  <div class="avatar-wrap"><img src="avatar.jpg" alt="decklife"></div>
  <h1>@decklife</h1>
  <p class="sub">Kreator Visual Sunset & Sunrise</p>
  <button class="btn btn-whatsapp" onclick="goLocked('whatsapp')"><span class="dot"></span> Whatsapp</button>
  <button class="btn btn-gmail" onclick="goGmail()">✉️ Gmail</button>
  <button class="btn btn-tiktok" onclick="goTikTok()">🎵 Tik Tok</button>
  <button class="btn btn-instagram" onclick="goLocked('instagram')">📷 Instagram</button>
  <button class="btn btn-facebook" onclick="goLocked('facebook')">f Facebook</button>
</div>
<div id="toast" class="toast"></div>
<script>
const LINKS = {
  gmail: "mailto:decklife92@gmail.com",
  tiktok_username: "@_decklife_",
  tiktok_url: "https://www.tiktok.com/@_decklife_",
  instagram: "https://www.instagram.com/decklife92?srtk=ZDZ5c2dkaGttZXY5",
  facebook: "https://www.facebook.com/share/1BLASZfm8Q/"
};
function showToast(msg){
  const t=document.getElementById('toast');
  t.innerText=msg; t.style.display='block';
  setTimeout(()=>t.style.display='none',3000);
}
function goLocked(type){
  sessionStorage.setItem('decklife_target', type);
  window.location.href = 'kunci.html';
}
function goTikTok(){
  const username = LINKS.tiktok_username;
  const url = LINKS.tiktok_url;
  if(navigator.clipboard){navigator.clipboard.writeText(username).catch(()=>{});}
  showToast('Username disalin: ' + username + ' - Membuka TikTok...');
  setTimeout(()=>{window.location.href = 'snssdk1233://user/profile/' + username.replace('@','');},200);
  setTimeout(()=>{window.open(url, '_blank');},800);
}
    function goGmail(){
      const email = "decklife92@gmail.com";
      if(navigator.clipboard){navigator.clipboard.writeText(email);}
      showToast('Email disalin: ' + email + ' 📧');
      setTimeout(()=>{window.location.href = 'mailto:'+email;},500);
}
</script>
</body>
</html>
