<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>@Decklife92 - Endorse</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif}
body{min-height:100vh;background:url('bg.jpg') center/cover no-repeat;display:flex;align-items:center;justify-content:center;padding:20px}
.card{background:#fff;width:100%;max-width:380px;padding:28px;border-radius:24px;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.2)}
.avatar{width:120px;height:120px;border-radius:50%;margin:0 auto 14px;display:block;object-fit:cover}
.username{font-size:30px;font-weight:800;color:#111}
.subtitle{font-size:14px;color:#666;margin:8px 0 20px}
.links{display:flex;flex-direction:column;gap:12px}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:14px;border-radius:14px;border:none;font-weight:700;font-size:15px;cursor:pointer;text-decoration:none}
.btn-black{background:#111;color:#fff}
.btn-white{background:#fff;color:#111;border:1.5px solid #ddd}
.btn:active{transform:scale(.97)}
.toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:#111;color:#fff;padding:12px 20px;border-radius:30px;font-size:13px;display:none}
</style>
</head>
<body>
<div class="card">
<img src="avatar.jpg" class="avatar" alt="decklife">
<div class="username">@Decklife92</div>
<div class="subtitle">Endorse & Business Contact</div>
<div class="links">
<a class="btn btn-white" href="https://www.instagram.com/decklife92/" target="_blank">Instagram</a>
<a class="btn btn-white" href="https://www.tiktok.com/@decklife92" target="_blank">Tiktok</a>
<button class="btn btn-black" onclick="window.open('kunci.html','_blank')">Whatsapp</button>
</div>
</div>
<div class="toast" id="toast">Copied!</div>
<script>
function copyAndOpen(text, url){
 navigator.clipboard.writeText(text);
 var t=document.getElementById('toast');
 t.style.display='block';
 setTimeout(()=>{t.style.display='none';window.open(url,'_blank')},800);
}
</script>
</body>
</html>
