<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Masukkan Kunci - Decklife</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif}
body{min-height:100vh;background:linear-gradient(rgba(0,0,0,.3),rgba(0,0,0,.3)),url('bg.jpg') center/cover no-repeat;display:flex;align-items:center;justify-content:center;padding:20px}
.card{background:#fff;width:100%;max-width:380px;padding:32px 28px;border-radius:24px;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.3)}
.title{font-size:22px;font-weight:800;margin-bottom:6px}
.desc{font-size:13px;color:#666;margin-bottom:20px}
.input{width:100%;padding:14px;border-radius:12px;border:1.5px solid #ddd;font-size:16px;text-align:center;letter-spacing:4px;font-weight:700;outline:none}
.input:focus{border-color:#111}
.btn{width:100%;padding:14px;border-radius:12px;border:none;background:#111;color:#fff;font-weight:700;font-size:15px;margin-top:14px;cursor:pointer}
.btn:active{transform:scale(.97)}
.error{color:red;font-size:12px;margin-top:10px;display:none}
</style>
</head>
<body>
<div class="card">
<div class="title">Masukkan Kunci</div>
<div class="desc">Hubungi @Decklife92 untuk mendapatkan kunci akses Whatsapp</div>
<input type="password" id="kunci" class="input" placeholder="****" maxlength="4" inputmode="numeric">
<button class="btn" onclick="cekKunci()">Buka Whatsapp</button>
<div class="error" id="error">Kunci salah! Hubun admin.</div>
</div>
<script>
function cekKunci(){
 var k=document.getElementById('kunci').value;
 var e=document.getElementById('error');
 if(k==='5795'){
   window.location.href='https://wa.me/628125443555?text=Halo%20kak%20Decklife%20mau%20endorse';
 }else{
   e.style.display='block';
   setTimeout(()=>{e.style.display='none'},2000);
 }
}
document.getElementById('kunci').addEventListener('keypress',function(e){if(e.key==='Enter'){cekKunci()}});
</script>
</body>
</html>
