<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kunci WA - @decklife</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif}
body{min-height:100vh;background:url('bg.jpg') center/cover no-repeat fixed;display:flex;align-items:center;justify-content:center;padding:20px}
.card{background:#fff;width:100%;max-width:360px;border-radius:28px;padding:28px 20px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.4)}
h2{font-size:22px;margin-bottom:8px} p{font-size:13px;color:#666;margin-bottom:18px}
input{width:100%;padding:14px;border-radius:12px;border:1.5px solid #ddd;font-size:18px;text-align:center;font-weight:700;letter-spacing:4px}
button{width:100%;margin-top:12px;padding:14px;border-radius:12px;border:none;background:#111;color:#fff;font-size:15px;font-weight:600;cursor:pointer}
.error{color:#e11;font-size:13px;margin-top:10px;display:none}
</style>
</head>
<body>
<div class="card">
<h2>🔒 Masukkan Kunci</h2>
<p>WA @Decklife92 terkunci! Masukkan kunci dulu!</p>
<input id="k" type="text" placeholder="****" maxlength="4" inputmode="numeric">
<button onclick="cek()">Buka WA</button>
<div class="error" id="err">Kunci salah! Tanya Raja dulu!</div>
</div>
<script>
function cek(){
 var v=document.getElementById('k').value;
 if(v==='5795'){
  window.location.href='https://wa.me/6281385947462?text=Halo%20Kak%20Decklife92%20mau%20endorse';
 } else {
  document.getElementById('err').style.display='block';
 }
}
</script>
</body>
</html>
