<script>

    document.getElementById('msg').innerText='Kode Salah! Cek Gmail decklife92@gmail.com';

  }
  if(t=='whatsapp'){ location.href='https://wa.me/6281254435553'; }

  else if(t=='instagram'){ location.href='https://www.instagram.com/decklife92'; }

  else { location.href='https://www.facebook.com/share/1BxQi2HqyS/'; }
}
