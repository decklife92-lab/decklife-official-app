<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kunci - @decklife</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',sans-serif;}
body{min-height:100vh;background:url('bg.jpg') no-repeat center center fixed;background-size:cover;display:flex;justify-content:center;align-items:center;padding:20px;}
.card{width:100%;max-width:380px;background:rgba(30,20,10,0.65);backdrop-filter:blur(18px);border-radius:28px;padding:28px 22px 30px;border:1px solid rgba(255,255,255,0.15);text-align:center;box-shadow:0 15px 40px rgba(0,0,0,0.5);}
.avatar-wrap{width:90px;height:90px;margin:0 auto 12px;background:#fff;border-radius:50%;padding:4px;}
.avatar-wrap img{width:100%;height:100%;border-radius:50%;object-fit:cover;}
h2{color:#fff;font-size:22px;margin-bottom:6px;}
p.info{color:rgba(255,255,255,0.7);font-size:13px;margin-bottom:18px;line-height:1.4;}
input{width:100%;padding:14px 16px;border-radius:12px;border:1px solid rgba(255,255,255,0.2);background:rgba(0,0,0,0.4);color:#fff;font-size:16px;text-align:center;outline:none;margin-bottom:12px;}
input::placeholder{color:rgba(255,255,255,0.4);}
.btn{width:100%;padding:14px;border:none;border-radius:12px;font-size:16px;font-weight:700;cursor:pointer;}
.btn-unlock{background:#fff;color:#000;margin-bottom:10px;}
.btn-back{background:rgba(255,255,255,0.15);color:#fff;}
.msg{margin-top:12px;font-size:13px;display:none;padding:10px;border-radius:10px;}
.msg.err{background:rgba(255,59,48,0.2);color:#ff9a95;display:block;}
.msg.ok{background:rgba(46,204,113,0.2);color:#7bed9f;display:block;}
.small{font-size:11px;color:rgba(255,255,255,0.5);margin-top:14px;}
</style>
</head>
<body>
<div class="card">
  <div class="avatar-wrap"><img src="avatar.jpg"></div>
  <h2 id="title">Masukkan Kode Rahasia</h2>
  <p class="info" id="info">Untuk membuka link ini butuh kode akses dari @decklife</p>
  <input type="password" id="kode" placeholder="Kode rahasia...">
  <button class="btn btn-unlock" onclick="cekKunci()">🔓 Buka Sekarang</button>
  <button class="btn btn-back" onclick="history.back()">← Kembali</button>
  <div id="msg" class="msg"></div>
  <div class="small">TikTok tidak butuh kunci, langsung buka</div>
</div>
<script>
const LINKS = {
  whatsapp: "https://wa.me/6281234567890",
  gmail: "mailto:decklife92@gmail.com",
  instagram: "https://www.instagram.com/opy_j?exln=ZDZ5c2dkaGttZXY5",
  facebook: "https://www.facebook.com/share/1BLASZfm8Q/",
  tiktok: "https://www.tiktok.com/@_decklife_"
};
const KODE_BENAR = ["992","DECKLIFE","decklife","decklife92","DECKLIFE92"];
function cekKunci(){
  const input = document.getElementById('kode').value.trim();
  const msg = document.getElementById('msg');
  const target = sessionStorage.getItem('decklife_target') || 'instagram';
  if(!input){msg.className='msg err'; msg.style.display='block'; msg.innerText='Isi dulu kodenya Raja!'; return;}
  if(KODE_BENAR.includes(input) || KODE_BENAR.includes(input.toUpperCase())){
    msg.className='msg ok'; msg.innerText='✅ Kode benar! Membuka '+target+'...'; msg.style.display='block';
    let url = LINKS[target] || LINKS.instagram;
    setTimeout(()=>{
      if(target==='gmail'){window.location.href = url;} else {window.open(url, '_blank');}
      setTimeout(()=>{ window.location.href='index.html'; }, 1000);
    }, 600);
  } else {
    msg.className='msg err'; msg.innerText='❌ Kode salah Raja! Coba lagi. Hint: 5795 / DECKLIFE'; msg.style.display='block';
  }
}
(function(){
  const t = sessionStorage.getItem('decklife_target');
  if(t){
    const title = document.getElementById('title');
    const info = document.getElementById('info');
    const label = t.charAt(0).toUpperCase()+t.slice(1);
    title.innerText = 'Buka ' + label;
    info.innerText = 'Masukkan kode rahasia untuk membuka ' + label + ' @decklife';
  }
})();
document.getElementById('kode').addEventListener('keypress', function(e){ if(e.key==='Enter') cekKunci(); });
</script>
</body>
</html>
