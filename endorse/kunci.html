<style>body{margin:0; min-height:100vh; background:#000; color:white; font-family:sans-serif; display:flex; justify-content:center; align-items:center;} .box{background:#111; border:1.8px solid #ffcc00; border-radius:20px; padding:20px; width:90%; max-width:380px; text-align:center;} input{width:90%; padding:14px; border-radius:12px; border:none; margin-top:12px; font-size:18px; text-align:center;} button{width:95%; padding:14px; border-radius:12px; border:none; margin-top:12px; font-weight:bold; background:#ffcc00; cursor:pointer;}</style>

<script>

  if(k!=='5795'){ document.getElementById('msg').innerText='Kode Salah! Hubungi Gmail decklife92@gmail.com'; return; }
  if(t=='whatsapp'){ location.href='https://wa.me/6281234567890'; }

  else if(t=='instagram'){ location.href='https://www.instagram.com/decklife'; }
  else if(t=='facebook'){ location.href='https://www.facebook.com/share/1BxQi2HqyS/'; }
}
</script>
